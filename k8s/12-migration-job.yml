apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: ecommerce
spec:
  template:
    spec:
      containers:
      - name: migration
        image: trainwithshubham/easyshop-migration:1 #change here 
        imagePullPolicy: Always
        env:
        - name: MONGODB_URI
          value: "mongodb://mongodb-service:27017/ecommerce"
      restartPolicy: OnFailure
